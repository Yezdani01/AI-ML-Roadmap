</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="#">iNotes</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

      </li>
      <li class="nav-item">

    <form class="form-inline my-2 my-lg-0">
      <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">

    <!-- <h1>

    <div class="container">
        <h1>Start adding your note to your database</h1>
<form action="/" method="post">
  <div class="form-group">
    <label for="Title">Note Title</label>
    <input type="text" class="form-control" name="title" aria-describedby="emailHelp" placeholder="Enter Title">
    <small id="emailHelp" class="form-text text-muted">Enter a good title for your note.</small>
  </div>
  <div class="form-group">
    <label for="desc">Note Description</label>
    <input type="text" class="form-control" name="desc" aria-describedby="emailHelp" placeholder="Enter Description">
    <small id="emailHelp" class="form-text text-muted">Enter a good Description for your note.</small>
  </div>
  <div class="form-check">
    <input type="checkbox" class="form-check-input" name="important" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
    </div>

{% for doc in newDocs %}

<div class="container">

    <form class="edit-note-form" data-id="{{ doc.id }}">

        <input
            type="text"
            name="title"
            value="{{ doc.title }}"
            class="form-control"
        >

        <input
            type="text"
            name="desc"
            value="{{ doc.desc }}"
            class="form-control"
        >

        <input
            type="checkbox"
            name="important"
            {% if doc.important %}checked{% endif %}
        >

        <button type="submit">Update Note</button>

    </form>

</div>

{% endfor %}







<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script>

document.querySelectorAll(".edit-note-form").forEach(form => {

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const id = form.dataset.id;

        const formData = new FormData(form);
        const body = new URLSearchParams(formData);

        const response = await fetch(`/${id}`, {
            method: "PUT",
            body: body
        });

        const result = await response.json();

        alert(result.Success ? "Note updated!" : "Note not found!");

        if (result.Success) {
            window.location.reload();
        }

    });

});

</script>
</body>
</html>
